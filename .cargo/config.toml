[build]
jobs = 4

# Test threads get the same stack as the server's worker threads
# (crates/server/src/main.rs). The default 2 MB is too little for the deepest
# command future in a debug build.
[env]
RUST_MIN_STACK = "8388608"

# Native dependencies use CMake. On Windows with VS 2022 Build Tools installed,
# set CMAKE_GENERATOR="Visual Studio 17 2022" in your build shell (HANDOFF.md).
# Do not set it globally here: Linux/macOS and Linux cross-builds need their own
# generators. Cargo defaults to ./target; CARGO_TARGET_DIR can override it.
