[package]
name = "sticktalk-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows GPU screen capture and Media Foundation codec pipeline for StickTalk"

[dependencies]
thiserror = "2"
openh264 = "0.9.8"
opus = "=0.4.0"
nnnoiseless = { version = "=0.5.2", default-features = false }
webrtc-audio-processing = { path = "vendor/webrtc-audio-processing", features = ["bundled"] }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "7b14b895fe7fc42cab72b4a4c1e49c982bd6404b", default-features = false, features = ["tract", "default-model-ll"] }
ndarray = "0.15"
# libDF uses the pre-ndarray-0.16 Tract API; upstream's caret allows breaking patches.
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
neteq = { path = "vendor/neteq", version = "=0.9.1", default-features = false }

[target.'cfg(windows)'.dependencies]
wasapi = "=0.27.0"
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation", "Win32_Media_DirectShow", "Win32_Media_Audio",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant", "Win32_System_Ole", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging",
    "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"
] }
[dev-dependencies]
hound = "3.5"
