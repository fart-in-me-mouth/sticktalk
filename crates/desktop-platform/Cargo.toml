[package]
name = "sticktalk-desktop-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sticktalk-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
base64 = "0.22"
ring = "0.17"
sha2 = "0.10"
semver = "1"
thiserror = "2"
fs2 = "0.4"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Media_Audio"] }
winreg = "0.55"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
axum.workspace = true
