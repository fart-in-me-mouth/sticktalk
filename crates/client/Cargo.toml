[package]
name = "sticktalk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sticktalk-proto.workspace = true
sticktalk-client-core = { path = "../client-core" }
sticktalk-emoji = { path = "../emoji" }
sticktalk-desktop-platform = { path = "../desktop-platform" }
iced_tiny_skia = { version = "0.14.1", default-features = false, features = ["image", "svg"] }
iced_runtime = "0.14"
iced_wgpu = { version = "0.14", optional = true, features = ["image", "svg"] }
tiny-skia = { version = "0.11", default-features = false }
iced = { workspace = true, features = ["advanced", "image-without-codecs", "svg"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
open = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = { version = "0.15", default-features = false }
libmimalloc-sys = { version = "0.1", optional = true, features = ["extended"] }
mimalloc = { version = "0.1", optional = true }
tokio-util = { version = "0.7", features = ["io"] }

[features]
compact-allocator = ["dep:mimalloc", "dep:libmimalloc-sys"]
default = ["wgpu"]
wgpu = ["iced/wgpu", "dep:iced_wgpu"]


[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
sticktalk-server = { path = "../server" }
tempfile = "3"
axum.workspace = true
rsa = "0.9"
ring = "0.17"
rand = "0.8"
