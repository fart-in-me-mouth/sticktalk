[package]
name = "sticktalk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Playback only needs a loopback HTTP/1 stream, not axum's WS/multipart stack.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
unicode-segmentation = "1.13"
sticktalk-proto.workspace = true
sticktalk-client-core = { path = "../client-core" }
sticktalk-media = { path = "../media" }
# Shared one-shot RTC pacing clock, not another media engine or runtime.
sticktalk-sfu = { path = "../sfu" }
sticktalk-desktop-platform = { path = "../desktop-platform" }
str0m = { version = "=0.25.0", default-features = false, features = ["rust-crypto"] }
sticktalk-emoji = { path = "../emoji" }
iced_tiny_skia = { version = "0.14.1", default-features = false, features = ["image", "svg"] }
iced_runtime = "0.14"
iced_wgpu = { version = "0.14", optional = true, features = ["image", "svg"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06"] }
tiny-skia = { version = "0.11", default-features = false }
iced = { workspace = true, features = ["advanced", "image-without-codecs", "svg"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
open = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = { version = "0.15", default-features = false }
libmimalloc-sys = { version = "0.1", optional = true, features = ["extended"] }
mimalloc = { version = "0.1", optional = true }
dhat = { version = "0.3.3", optional = true }
tokio-util = { version = "0.7", features = ["io"] }

[features]
# Diagnostic only: tracks Rust allocation stacks; never use its timing/RAM as shipping measurements.
heap-profile = ["dep:dhat"]
compact-allocator = ["dep:mimalloc", "dep:libmimalloc-sys"]
default = ["wgpu"]
wgpu = ["iced/wgpu", "dep:iced_wgpu", "dep:winit", "dep:windows58"]


[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation"] }
socket2 = "0.6"
windows58 = { package = "windows", version = "0.58", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D12"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Networking_WinSock", "Win32_System_Time", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }



[dev-dependencies]
sticktalk-server = { path = "../server" }
tempfile = "3"
axum.workspace = true
rsa = "0.9"
ring = "0.17"
rand = "0.8"

[build-dependencies]
winresource = '0.1'
