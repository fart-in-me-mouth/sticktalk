<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111113">
  <meta name="description" content="StickTalk — messages, friends and voice calls.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StickTalk">
  <title>StickTalk</title>
  <link data-trunk rel="rust" data-wasm-opt="0" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int">
  <link data-trunk rel="css" href="live.css">
  <link data-trunk rel="copy-dir" href="public">
  <link data-trunk rel="copy-file" href="style.css">
  <link rel="manifest" href="public/manifest.webmanifest">
  <link rel="icon" href="public/icons/icon-192.png">
  <link rel="apple-touch-icon" href="public/icons/apple-touch-icon.png">
  <link rel="preload" href="public/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>html,body{margin:0;background:#111113;color:#E8EAED;font-family:Inter,system-ui,sans-serif}#boot{height:100%;font-size:15px}</style>
  <script type="module" src="public/platform.js"></script>
</head>
<body><div id="boot"><main class="auth-page"><form class="auth-card" data-live-form="auth" method="post" action="/api/v1/browser/session/login"><div class="auth-brand"><img class="auth-logo" src="/public/icons/icon-192.png" alt="" width="48" height="48"><span>StickTalk</span></div><h1 id="boot-title">Welcome back!</h1><p class="auth-subtitle" id="boot-subtitle">Log in to catch up with your friends.</p><div class="field"><label for="auth-username">Username</label><input id="auth-username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required minlength="3" maxlength="32"></div><div class="field" id="boot-password"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="current-password" required maxlength="128"></div><button class="button primary" type="submit" id="boot-submit">Log In</button><p class="auth-status" id="boot-status" role="status"></p><a class="button secondary google-button" id="boot-google" href="/api/v1/browser/google/start" hidden><img src="/public/google-g.svg" alt="" width="20" height="20">Continue with Google</a><p class="auth-switch"><span id="boot-switch-copy">Need an account? </span><button type="button" data-live="register">Register</button></p></form></main></div><template id="chat-skeleton"><div class="app-shell skeleton-shell" role="status" aria-label="Loading conversations"><div class="left-panel"><nav class="server-rail"><img src="/public/icons/icon-192.png" width="48" height="48" alt="StickTalk"></nav><aside class="channel-sidebar"><div class="sidebar-header">StickTalk</div><div class="skeleton-lines"><span></span><span></span><span></span><span></span></div></aside></div><main class="main-pane"><header class="channel-header"><strong>StickTalk</strong></header><div class="connection-banner">Reconnecting…</div><div class="skeleton-messages"><div></div><div></div><div></div></div><div class="skeleton-composer"></div></main></div></template><noscript>Enable JavaScript to open StickTalk.</noscript></body>
</html>
