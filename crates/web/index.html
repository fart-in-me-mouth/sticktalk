<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111113">
  <meta name="description" content="StickTalk — messages, friends and voice calls.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StickTalk">
  <!-- No style nonce in this app's CSP: UI SDK then adopts constructed style sheets. -->
  <meta property="csp-nonce">
  <title>StickTalk</title>
  <link data-trunk rel="rust" data-wasm-opt="0" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int">
  <link data-trunk rel="tailwind-css" href="styles/app.css">
  <link data-trunk rel="copy-dir" href="public">
  <link data-trunk rel="copy-file" href="style.css">
  <link rel="manifest" href="public/manifest.webmanifest">
  <link rel="icon" href="public/icons/icon-192.png">
  <link rel="apple-touch-icon" href="public/icons/apple-touch-icon.png">
  <link rel="preload" href="public/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Theme, accessibility settings and app icon, before the first paint (docs/features/themes.md). -->
  <script src="/public/theme-boot.js"></script>
  <style>html,body{margin:0;background:var(--bg-rail,#111113);color:var(--text-primary,#E8EAED);font-family:Inter,system-ui,sans-serif}#boot{height:100%;font-size:15px}</style>
  <script type="module" src="public/platform.js"></script>
</head>
<body><div id="boot"><main class="auth-page grid h-(--viewport-height) place-items-center overflow-y-auto p-6 [scroll-padding-block:calc(16px+var(--safe-top))_calc(24px+var(--safe-bottom))] phone:relative phone:top-(--viewport-offset) phone:flex phone:flex-col phone:justify-[safe_center] phone:bg-background phone:px-6 phone:pt-[calc(32px+var(--safe-top))] phone:pb-[calc(32px+var(--safe-bottom))]"><form class="auth-card w-[min(440px,100%)] rounded-xl border bg-background p-8 shadow-sm phone:my-auto phone:w-full phone:max-w-[480px] phone:rounded-none phone:border-0 phone:bg-transparent phone:p-0 phone:shadow-none" data-live-form="auth" method="post" action="/api/v1/browser/session/login"><div class="auth-brand flex items-center gap-3 text-xl font-semibold phone:justify-center"><img class="auth-logo flex-none rounded-xl" data-app-logo src="/public/icons/icon-192.png" alt="" width="48" height="48"><span>StickTalk</span></div><h1 class="mt-8 mb-2 text-[28px] leading-tight phone:text-center" id="boot-title">Welcome back!</h1><p class="auth-subtitle mb-8 text-[15px] text-subtle phone:text-center" id="boot-subtitle">Log in to catch up with your friends.</p><div class="field mb-6"><label for="auth-username">Username</label><input class="h-12 text-base touch:min-h-[52px]" id="auth-username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required minlength="3" maxlength="32"><small id="boot-username-help" hidden>3 to 32 letters, numbers or underscores.</small></div><div class="field mb-6" id="boot-code" hidden><label for="auth-code">Reset Code</label><input class="h-12 text-base touch:min-h-[52px]" id="auth-code" name="code" autocomplete="one-time-code" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64"></div><div class="field mb-6" id="boot-password"><label for="auth-password" id="boot-password-label">Password</label><input class="h-12 text-base touch:min-h-[52px]" id="auth-password" name="password" type="password" autocomplete="current-password" required maxlength="128"><a class="self-start text-[13px]" id="boot-forgot" href="/?reset">Forgot your password?</a></div><button class="button primary h-12 w-full text-[15px]" type="submit" id="boot-submit">Log In</button><p class="auth-status my-3 text-[13px] text-muted-foreground empty:hidden" id="boot-status" role="status"></p><a class="button secondary google-button mt-4 flex h-12 w-full border bg-muted text-[15px]" id="boot-google" href="/api/v1/browser/google/start" hidden><img src="/public/google-g.svg" alt="" width="20" height="20">Continue with Google</a><p class="auth-switch mt-6 text-[15px] text-subtle phone:text-center"><span id="boot-switch-copy">Need an account? </span><button class="inline-flex min-h-11 items-center px-1 font-semibold text-primary hover:underline" type="button" data-live="register">Register</button></p></form></main></div><template id="chat-skeleton"><div class="app-shell skeleton-shell pointer-events-none relative top-(--viewport-offset) flex h-(--viewport-height) bg-background" role="status" aria-label="Loading conversations"><div class="left-panel flex w-[312px] flex-none bg-sidebar phone:hidden"><nav class="server-rail flex w-[72px] flex-col items-center gap-2 bg-rail p-3"><img class="rounded-2xl" data-app-logo src="/public/icons/icon-192.png" width="48" height="48" alt="StickTalk"></nav><aside class="channel-sidebar flex w-60 flex-col"><div class="sidebar-header flex h-12 items-center border-b px-4 font-semibold">StickTalk</div><div class="skeleton-lines grid gap-4 px-4 py-6 [&>span]:h-4 [&>span]:w-4/5 [&>span]:rounded-sm [&>span]:bg-muted"><span></span><span></span><span></span><span></span></div></aside></div><main class="main-pane flex min-w-0 flex-1 flex-col"><header class="channel-header flex h-12 flex-none items-center border-b px-4"><strong>StickTalk</strong></header><div class="skeleton-messages mt-auto grid gap-6 p-4 [&>div]:h-10 [&>div]:w-[min(80%,480px)] [&>div]:rounded-lg [&>div]:bg-muted"><div></div><div></div><div></div></div><div class="skeleton-composer m-4 h-12 rounded-lg bg-muted"></div></main></div></template><noscript>Enable JavaScript to open StickTalk.</noscript></body>
</html>
