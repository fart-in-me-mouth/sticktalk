<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111113">
  <meta name="description" content="StickTalk — messages, friends and voice calls.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StickTalk">
  <title>StickTalk</title>
  <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int">
  <link data-trunk rel="css" href="live.css">
  <link data-trunk rel="copy-dir" href="public">
  <link data-trunk rel="copy-file" href="style.css">
  <link rel="manifest" href="public/manifest.webmanifest">
  <link rel="icon" href="public/icons/icon-192.png">
  <link rel="apple-touch-icon" href="public/icons/apple-touch-icon.png">
  <link rel="preload" href="public/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>html,body{margin:0;background:#111113;color:#E8EAED;font-family:Inter,system-ui,sans-serif}#boot{height:100%;font-size:15px}</style>
  <script type="module" src="public/platform.js"></script>
</head>
<body><div id="boot"><main class="auth-page"><form class="auth-card" data-live-form="auth" method="post" action="/api/v1/browser/session/login"><img class="auth-logo" src="/public/icons/icon-192.png" alt="StickTalk" width="48" height="48"><h1 id="boot-title">Log in</h1><div class="field"><label for="auth-username">Username</label><input id="auth-username" name="username" autocomplete="username" required minlength="3" maxlength="32"></div><div class="field" id="boot-password"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></div><button class="button primary" type="submit" id="boot-submit">Log In</button><p id="boot-status" role="status"></p><a class="button secondary google-button" id="boot-google" href="/api/v1/browser/google/start" hidden><img src="/public/google-g.svg" alt="" width="20" height="20">Continue with Google</a><button class="button link-button" type="button" data-live="register">Create an account</button></form></main></div><noscript>Enable JavaScript to open StickTalk.</noscript></body>
</html>
