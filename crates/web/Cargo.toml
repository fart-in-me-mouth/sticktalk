[package]
name = "sticktalk-web"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

# Isolated until client-core lands; no edits to the shared workspace required.
[workspace]

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Event", "CustomEvent", "CustomEventInit", "Location", "KeyboardEvent"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
