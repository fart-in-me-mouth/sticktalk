[package]
name = "sticktalk-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime-independent StickTalk state, protocol, REST and mock peer"

[features]
default = []
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]

[dependencies]
sticktalk-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
sha2 = "0.10"
base64 = "0.22"
url = "2"
futures-util = { version = "0.3", features = ["sink", "channel"] }
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Performance", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "Request", "RequestInit", "RequestMode", "RequestRedirect", "RequestCredentials", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "Blob", "Crypto", "AbortController", "AbortSignal"] }
