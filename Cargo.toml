[workspace]
members = ["crates/proto", "crates/server", "crates/client", "crates/client-core", "crates/media", "crates/sfu", "crates/desktop-platform", "crates/emoji", "crates/web"]
resolver = "2"
# Vendored dependencies are not first-party workspace test/example targets.
exclude = ["crates/media/vendor/neteq", "crates/media/vendor/webrtc-audio-processing", "crates/media/vendor/webrtc-audio-processing-sys"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sticktalk-proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
rmp-serde = "1.3"
# Reserved for implementation engineers; unused by the foundation stubs.
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.5"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio"] }

# Disk is tight on the dev PC: keep debug info small (line tables only for our
# crates, none for dependencies). Cuts target dirs by more than half.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-small]
inherits = "release"
opt-level = "s"

# Preserve the isolated web shell's full dependency size profile, not only its bin.
[profile.web-release]
inherits = "release"
opt-level = "z"
strip = "debuginfo"
